name: treningsapp

# openGym (https://github.com/DuarteSantos8/openGym) kjører uendret fra de ferdige imagene,
# med Caddy foran for automatisk HTTPS. Garmin-synken kommer som en egen tjeneste senere.
#
# Oppdatere: docker compose pull && docker compose up -d

services:
  # openGym sitt API: innlogging med passkey og dataene til hver profil.
  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
      # API-et nås bare via web-containeren, som skriver over X-Forwarded-For.
      - TRUST_PROXY=1
    volumes:
      - ./data:/data   # ALT av treningsdata, profiler og passkeys. Tas backup av hver natt.

  # openGym sin nettside (nginx). Ingen åpne porter: bare Caddy snakker med den.
  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NGINX_PORT=80
      - BACKEND=api
      - PORT=3000
      - RESOLVER=127.0.0.11
      - CF_CONNECTING_IP=
      - BASE_PATH=
      - MEDIA_UPLOAD_MAX=48m

  # Caddy henter og fornyer HTTPS-sertifikat fra Let's Encrypt helt av seg selv.
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Henter løpeturer og andre aktiviteter fra Garmin inn i openGym (docs/2-garmin-sync.md).
  garmin-sync:
    build: ./garmin-sync
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - OPENGYM_URL=http://api:3000
      - GARMIN_SYNC_OPENGYM_TOKEN=${GARMIN_SYNC_OPENGYM_TOKEN:-}
      - SYNC_INTERVAL_MIN=${SYNC_INTERVAL_MIN:-30}
      - PUSH_TO_GARMIN=${PUSH_TO_GARMIN:-1}
      - OPENGYM_LIB=/opengym-src/lib
      - TZ=${TZ:-Europe/Oslo}
    volumes:
      - ./garmin-tokens:/tokens   # Garmin-innlogging (ikke passordet). Ikke i git, ikke i backup.
      - ../frontend/src:/opengym-src:ro   # openGyms egen .fit-eksport, for styrkeøkter til Garmin

volumes:
  caddy_data:
  caddy_config:
